name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── Full Build (Java CSP + Component Plugin zip) ───────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('csp/**/*.gradle*', 'csp/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run build.sh
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/

  # ─── Java Lint (Checkstyle + SpotBugs + PMD) ────────────────────────
  java-lint:
    name: Java Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csp
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('csp/**/*.gradle*', 'csp/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Checkstyle
        run: ./gradlew checkstyleMain

      - name: SpotBugs
        run: ./gradlew spotbugsMain

      - name: PMD
        run: ./gradlew pmdMain

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-lint-reports
          path: |
            csp/build/reports/checkstyle/
            csp/build/reports/spotbugs/
            csp/build/reports/pmd/

  # ─── JavaScript Lint + Test + CVE ────────────────────────────────────
  js:
    name: JavaScript Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Run tests
        run: npm test -- --watchAll=false --ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-coverage
          path: cp/coverage/
