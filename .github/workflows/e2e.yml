# Fork-only workflow: runs the browser e2e suite in e2e-tests/ (which exists
# only on this fork's master). Lives on master only — PR branches cut from
# upstream/master do not carry it, so it never appears in upstream PRs.
name: E2E

on:
  push:
    branches: [master]
    paths:
      - "cp/**"
      - "e2e-tests/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run e2e suite
        run: npm test

      - name: Upload visual test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-test-report
          path: e2e-tests/test-report/
          retention-days: 14

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e-tests/playwright-report/
          retention-days: 14
